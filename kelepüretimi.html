<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Üretim Takip</title>
  <style>
    :root {
      --bg: #f4f2ec;
      --panel: #ffffff;
      --panel-2: #f1eee4;
      --line: #e2ddcd;
      --ink: #262119;
      --ink-dim: #8a8270;
      --accent: #b8842e;
      --accent-dim: #e9d9b6;
      --ok: #2f9e5c;
      --danger: #c1503a;
      --tab-bg: #eae6d8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(1100px 500px at 15% -10%, rgba(184, 132, 46, 0.07), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 28px 16px 60px;
    }

    .wrap {
      max-width: 620px;
      margin: 0 auto;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      background: var(--tab-bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--ink-dim);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn.active {
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 4px 12px -6px rgba(0, 0, 0, 0.4);
    }

    .tab-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    #tabCile .tab-dot {
      background: #e8b23c;
    }

    .module {
      display: none;
    }

    .module.active {
      display: block;
    }

    /* Header */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin: 0 0 6px;
    }

    h1 {
      font-size: 22px;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .date-field {
      text-align: right;
    }

    .date-field label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--ink-dim);
      margin-bottom: 4px;
    }

    .date-field input {
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      width: 150px;
      color-scheme: light;
    }

    /* Table card */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 32px -18px rgba(80, 70, 40, 0.18);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: var(--panel-2);
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-dim);
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    thead th.num {
      text-align: right;
    }

    tbody tr {
      border-bottom: 1px solid var(--line);
      transition: background 0.15s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: rgba(184, 132, 46, 0.06);
    }

    td {
      padding: 9px 16px;
      font-size: 14.5px;
      vertical-align: middle;
    }

    td.name {
      font-weight: 600;
      color: var(--ink);
    }

    .idx {
      display: inline-block;
      width: 18px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      margin-right: 8px;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .name-row {
      display: flex;
      align-items: center;
    }

    .name-input {
      flex: 1;
      min-width: 90px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink);
      font-weight: 600;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 14.5px;
      font-family: inherit;
    }

    .name-input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--panel-2);
    }

    .name-input::placeholder {
      color: #b9b3a0;
      font-weight: 400;
    }

    td.td-del {
      padding: 9px 6px 9px 0;
      width: 30px;
    }

    .row-del {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      opacity: 0.5;
      transition: opacity 0.15s, border-color 0.15s, color 0.15s;
    }

    .row-del:hover {
      opacity: 1;
      border-color: var(--danger);
      color: var(--danger);
    }

    .row-del svg {
      width: 14px;
      height: 14px;
    }

    .add-row-btn {
      width: 100%;
      background: transparent;
      border: 1.5px dashed var(--line);
      color: var(--ink-dim);
      font-size: 13px;
      font-weight: 700;
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .add-row-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--panel-2);
    }

    .add-row-btn svg {
      width: 15px;
      height: 15px;
    }

    .sub {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-dim);
      margin-top: 1px;
    }

    td.val {
      text-align: right;
    }

    .num-input {
      width: 84px;
      text-align: right;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 14.5px;
      font-variant-numeric: tabular-nums;
      font-family: inherit;
      transition: border-color 0.15s, background 0.15s;
    }

    .num-input:focus {
      outline: none;
      border-color: var(--accent);
      background: #eef5ee;
    }

    .num-input::placeholder {
      color: #b9b3a0;
    }

    .qty-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .qty-wrap .num-input {
      width: 84px;
      padding-right: 10px;
    }

    .qty-wrap .suffix {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-dim);
      pointer-events: none;
    }

    .unit-input {
      width: 52px;
      text-align: center;
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-dim);
      border-radius: 6px;
      padding: 5px 4px;
      font-size: 12.5px;
      font-family: inherit;
    }

    .unit-input:focus {
      outline: none;
      border-color: var(--line);
      background: var(--panel-2);
    }

    .note-input {
      width: 100%;
      min-width: 90px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-dim);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12.5px;
      font-family: inherit;
    }

    .note-input:focus {
      outline: none;
      border-color: var(--line);
      background: var(--panel-2);
      color: var(--ink);
    }

    .note-input::placeholder {
      color: #c2bca8;
    }

    tfoot td {
      padding: 16px;
      font-size: 15px;
      font-weight: 800;
      background: var(--panel-2);
      border-top: 2px solid var(--accent-dim);
    }

    tfoot td.val {
      text-align: right;
      color: var(--accent);
      font-size: 20px;
      font-variant-numeric: tabular-nums;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 13px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, background 0.15s, border-color 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    .copy-btn {
      flex: 1;
      background: linear-gradient(180deg, #27c26b, #1fa85b);
      border-color: #1fa85b;
      color: #06210f;
    }

    .copy-btn:hover {
      filter: brightness(1.06);
    }

    .copy-btn.copied {
      background: var(--ok);
    }

    .clear-btn {
      background: var(--panel-2);
      color: var(--ink-dim);
    }

    .clear-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .reset-btn {
      background: var(--panel-2);
      color: var(--ink-dim);
      flex: 0 0 auto;
    }

    .reset-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hint {
      text-align: center;
      font-size: 11.5px;
      color: var(--ink-dim);
      margin-top: 12px;
    }

    svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 19px;
      }

      td,
      thead th {
        padding: 9px 10px;
      }

      .num-input {
        width: 78px;
      }

      .unit-input {
        display: none;
      }

      th.th-unit {
        display: none;
      }

      td.td-unit {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="tabs">
      <button class="tab-btn active" id="tabCile" data-target="module-cile"><span class="tab-dot"></span>Kelep
        Üretimi</button>
    </div>

    <!-- MODULE: KELEP ÜRETİMİ -->
    <section class="module active" id="module-cile">
      <header>
        <div>
          <p class="eyebrow">Üretim Takip</p>
          <h1>Kelep Üretimi</h1>
        </div>
        <div class="date-field">
          <label for="tarihCile">Tarih</label>
          <input type="date" id="tarihCile">
        </div>
      </header>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>İplik Adı</th>
              <th class="num">Kğ</th>
              <th>Açıklama</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbodyCile"></tbody>
          <tfoot>
            <tr>
              <td>Genel Toplam</td>
              <td class="val" id="toplamCile">0</td>
              <td></td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <button class="add-row-btn" id="addCile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        İplik Ekle
      </button>

      <div class="actions">
        <button class="copy-btn" id="copyCile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="9" y="9" width="12" height="12" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="copy-label">Tabloyu Kopyala</span>
        </button>
        <button class="clear-btn" id="clearCile" title="Tümünü Temizle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          </svg>
        </button>
        <button class="reset-btn" id="resetCile" title="Varsayılanlara Sıfırla">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <path d="M3 4v5h5"></path>
          </svg>
        </button>
      </div>
      <p class="hint">Kopyala butonu tabloyu görsel (resim) olarak panoya alır — WhatsApp'a yapıştırınca Excel'de olduğu
        gibi tablo görüntüsü gider.</p>
    </section>

  </div>

  <script>
    /* ---------- ORTAK ---------- */
    function fmt(n) { return n.toLocaleString('tr-TR', { maximumFractionDigits: 2 }); }
    function parseNum(v) { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }

    /* ---------- KALICI KAYIT (localStorage) ---------- */
    function saveModule(storageKey, tbody, fields) {
      const rows = [];
      tbody.querySelectorAll('tr').forEach(tr => {
        const row = {};
        fields.forEach(f => {
          const el = tr.querySelector(f.selector);
          row[f.name] = el ? el.value : '';
        });
        rows.push(row);
      });
      try {
        localStorage.setItem(storageKey, JSON.stringify(rows));
      } catch (e) {
        console.warn('Kaydedilemedi:', e);
      }
    }

    function loadModule(storageKey) {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!Array.isArray(data)) return null;
        return data;
      } catch (e) {
        return null;
      }
    }

    /* ---------- TAB SWITCH ---------- */
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
        document.getElementById(btn.dataset.target).classList.add('active');
      });
    });

    /* ---------- KELEP ÜRETİMİ ---------- */
    const iplikler = [
      "LOTUS", "RAYONEL", "BRENDİ", "OLİPS", "MULERRY", "LACCOS", "GABRİEL", "İNFİNİTY",
      "SİRİUS", "KAŞMİRA", "NEVA", "PAROS", "SİSAM", "CONTES", "VARMENT", "HEAVEN",
      "MİNK", "İMPLUS-C", "LAMSLOOK--", "RAYO--LON", "PAMİRA", "OLİMPUS", "AVVA",
      "BOBİN  BOYA  AKTARMA", "ÇİLE AKTARMA", "Y-İMPLUS-C"
    ];

    const tbodyCile = document.getElementById('tbodyCile');
    const toplamCileEl = document.getElementById('toplamCile');
    const trashSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>`;

    function renumberIdx(tbody) {
      tbody.querySelectorAll('tr').forEach((tr, i) => {
        const idx = tr.querySelector('.idx');
        if (idx) idx.textContent = String(i + 1).padStart(2, '0');
      });
    }

    const CILE_KEY = 'uretimTakip_kelep_v1';
    const CILE_FIELDS = [
      { name: 'ad', selector: '.name-input' }
    ];
    function saveCile() { saveModule(CILE_KEY, tbodyCile, CILE_FIELDS); }

    function createRowCile(u = {}) {
      if (typeof u === 'string') u = { ad: u };
      const ad = u.ad || '', qty = u.qty || '', not_ = u.not_ || '';
      const tr = document.createElement('tr');
      tr.innerHTML = `
    <td class="name"><div class="name-row"><span class="idx">00</span><input type="text" class="name-input" placeholder="İplik adı" value="${ad}"></div></td>
    <td class="val"><div class="qty-wrap"><input type="number" class="num-input" placeholder="0" step="any" inputmode="decimal" value="${qty}"><span class="suffix">kg</span></div></td>
    <td><input type="text" class="note-input" placeholder="Açıklama girin" value="${not_}"></td>
    <td class="td-del"><button class="row-del" type="button" title="Satırı sil">${trashSvg}</button></td>
  `;
      tbodyCile.appendChild(tr);
      renumberIdx(tbodyCile);
    }

    const kayitliCile = loadModule(CILE_KEY);
    if (kayitliCile && kayitliCile.length) {
      kayitliCile.forEach(u => createRowCile(u));
    } else {
      iplikler.forEach(ad => createRowCile(ad));
    }

    function hesaplaCile() {
      let toplam = 0;
      tbodyCile.querySelectorAll('.num-input').forEach(inp => toplam += parseNum(inp.value));
      toplamCileEl.textContent = fmt(toplam);
    }
    tbodyCile.addEventListener('input', () => { hesaplaCile(); saveCile(); });
    tbodyCile.addEventListener('click', (e) => {
      const btn = e.target.closest('.row-del');
      if (!btn) return;
      if (!confirm('Bu iplik satırını silmek istediğinize emin misiniz?')) return;
      btn.closest('tr').remove();
      renumberIdx(tbodyCile);
      hesaplaCile();
      saveCile();
    });
    document.getElementById('tarihCile').valueAsDate = new Date();
    hesaplaCile();

    document.getElementById('addCile').addEventListener('click', () => {
      createRowCile('');
      const rows = tbodyCile.querySelectorAll('.name-input');
      rows[rows.length - 1].focus();
      saveCile();
    });

    document.getElementById('clearCile').addEventListener('click', () => {
      tbodyCile.querySelectorAll('.num-input').forEach(inp => inp.value = '');
      hesaplaCile();
      saveCile();
    });

    document.getElementById('resetCile').addEventListener('click', () => {
      if (!confirm('Kelep Üretimi listesini varsayılan iplik listesine sıfırlamak istediğinize emin misiniz? Eklediğiniz/sildiğiniz tüm değişiklikler kaybolacak.')) return;
      tbodyCile.innerHTML = '';
      iplikler.forEach(ad => createRowCile(ad));
      hesaplaCile();
      saveCile();
    });

    document.getElementById('copyCile').addEventListener('click', (e) => {
      const btn = e.currentTarget;
      const tarihVal = document.getElementById('tarihCile').value;
      let tarihStr = '';
      if (tarihVal) { const [y, m, d] = tarihVal.split('-'); tarihStr = `${d}.${m}.${y}`; }

      const baslik = `KELEP ÜRETİMİ${tarihStr ? ' - ' + tarihStr : ''}`;
      let lines = [baslik, ''];
      let tabloRows = [];
      tbodyCile.querySelectorAll('tr').forEach(tr => {
        const nameInp = tr.querySelector('.name-input');
        const qtyInp = tr.querySelector('.num-input');
        const noteInp = tr.querySelector('.note-input');
        const v = parseNum(qtyInp.value);
        const ad = nameInp.value.trim();
        const not_ = noteInp ? noteInp.value.trim() : '';
        if (v !== 0 && ad) {
          let line = `${ad}: ${fmt(v)} Kğ`;
          if (not_) line += ` (${not_})`;
          lines.push(line);
          tabloRows.push([ad, `${fmt(v)} Kğ`, not_]);
        }
      });
      lines.push('', `GENEL TOPLAM: ${toplamCileEl.textContent} Kğ`);

      const imgPromise = tabloResmi(baslik, ['İplik Adı', 'Miktar', 'Açıklama'], tabloRows, 'GENEL TOPLAM', `${toplamCileEl.textContent} Kğ`, '#b8842e', 1);
      kopyalaMetin(lines.join('\n'), imgPromise, btn);
    });

    /* ---------- TABLOYU RESİM OLARAK ÜRETME ---------- */
    function tabloResmi(baslik, headers, rows, toplamLabel, toplamDeger, accent, valueColIndex) {
      if (valueColIndex === undefined || valueColIndex === null) valueColIndex = headers.length - 1;
      return new Promise((resolve) => {
        const scale = 2;
        const padX = 14;
        const rowH = 34, headerH = 36, titleH = 42, totalRowH = 38;
        const font = '13.5px Arial';
        const boldFont = 'bold 13.5px Arial';
        const titleFont = 'bold 16px Arial';

        const mcanvas = document.createElement('canvas');
        const mctx = mcanvas.getContext('2d');

        // sütun genişliklerini hesapla
        let colWidths = headers.map(h => { mctx.font = boldFont; return mctx.measureText(h).width; });
        rows.forEach(r => {
          r.forEach((c, i) => {
            mctx.font = font;
            const w = mctx.measureText(String(c)).width;
            if (w > colWidths[i]) colWidths[i] = w;
          });
        });
        colWidths = colWidths.map(w => Math.ceil(w) + padX * 2);

        mctx.font = boldFont;
        const totalLabelW = mctx.measureText(toplamLabel).width + padX * 2;
        const totalValW = mctx.measureText(toplamDeger).width + padX * 2;
        // toplam etiketi, değer sütunundan önceki sütunlara sığmalı
        const labelColsW = colWidths.slice(0, valueColIndex).reduce((a, b) => a + b, 0);
        if (labelColsW < totalLabelW) colWidths[0] += (totalLabelW - labelColsW);
        // toplam değeri, kendi sütununa (valueColIndex) sığmalı
        if (colWidths[valueColIndex] < totalValW) colWidths[valueColIndex] = totalValW;

        mctx.font = titleFont;
        const titleW = Math.ceil(mctx.measureText(baslik).width) + padX * 2;

        const tableWidth = colWidths.reduce((a, b) => a + b, 0);
        const totalWidth = Math.max(tableWidth, titleW);
        const tableHeight = headerH + rows.length * rowH + totalRowH;
        const totalHeight = titleH + tableHeight;

        const canvas = document.createElement('canvas');
        canvas.width = totalWidth * scale;
        canvas.height = totalHeight * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        // arka plan
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, totalWidth, totalHeight);

        // başlık
        ctx.fillStyle = '#262119';
        ctx.font = titleFont;
        ctx.textBaseline = 'middle';
        ctx.fillText(baslik, padX, titleH / 2 + 2);

        let y = titleH;

        // başlık satırı (header)
        ctx.fillStyle = '#f1eee4';
        ctx.fillRect(0, y, tableWidth, headerH);
        let x = 0;
        headers.forEach((h, i) => {
          ctx.fillStyle = '#8a8270';
          ctx.font = boldFont;
          ctx.fillText(h, x + padX, y + headerH / 2);
          x += colWidths[i];
        });
        y += headerH;

        // veri satırları
        rows.forEach(r => {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, y, tableWidth, rowH);
          x = 0;
          r.forEach((c, i) => {
            ctx.fillStyle = i === 0 ? '#262119' : '#4a4536';
            ctx.font = i === 0 ? boldFont : font;
            ctx.fillText(String(c), x + padX, y + rowH / 2);
            x += colWidths[i];
          });
          y += rowH;
        });

        // toplam satırı
        ctx.fillStyle = '#f1eee4';
        ctx.fillRect(0, y, tableWidth, totalRowH);
        ctx.fillStyle = accent || '#b8842e';
        ctx.font = boldFont;
        ctx.fillText(toplamLabel, padX, y + totalRowH / 2);
        // toplam değeri, ait olduğu sütunun (valueColIndex) sağına hizalanır
        const valueColStartX = colWidths.slice(0, valueColIndex).reduce((a, b) => a + b, 0);
        const valueColEndX = valueColStartX + colWidths[valueColIndex];
        ctx.textAlign = 'right';
        ctx.font = 'bold 15px Arial';
        ctx.fillText(toplamDeger, valueColEndX - padX, y + totalRowH / 2);
        ctx.textAlign = 'left';
        y += totalRowH;

        // çizgiler (grid)
        ctx.strokeStyle = '#d8d2c0';
        ctx.lineWidth = 1;
        // yatay çizgiler
        let ly = titleH;
        ctx.beginPath();
        ctx.moveTo(0, ly + 0.5); ctx.lineTo(tableWidth, ly + 0.5);
        ly += headerH;
        for (let i = 0; i <= rows.length; i++) {
          ctx.moveTo(0, ly + 0.5); ctx.lineTo(tableWidth, ly + 0.5);
          ly += rowH;
        }
        ctx.stroke();
        // dış çerçeve
        ctx.strokeRect(0.5, titleH + 0.5, tableWidth - 1, tableHeight - 1);
        // dikey çizgiler (sadece header ve veri satırları için)
        x = 0;
        ctx.beginPath();
        for (let i = 0; i < colWidths.length - 1; i++) {
          x += colWidths[i];
          ctx.moveTo(x + 0.5, titleH);
          ctx.lineTo(x + 0.5, titleH + headerH + rows.length * rowH);
        }
        ctx.stroke();
        // toplam satırında sadece değer sütunundan önce dikey çizgi
        ctx.beginPath();
        ctx.moveTo(valueColStartX + 0.5, y - totalRowH);
        ctx.lineTo(valueColStartX + 0.5, y);
        ctx.stroke();

        canvas.toBlob(blob => resolve(blob), 'image/png');
      });
    }

    /* ---------- KOPYALAMA ---------- */
    function kopyalaMetin(text, imageBlobPromise, btn) {
      const label = btn.querySelector('.copy-label');
      const oldLabel = label.textContent;
      const finish = () => {
        btn.classList.add('copied');
        label.textContent = 'Kopyalandı ✓';
        setTimeout(() => { btn.classList.remove('copied'); label.textContent = oldLabel; }, 1600);
      };
      const textOnlyFallback = () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(finish).catch((err) => {
            console.warn('navigator.clipboard.writeText de engellendi, eski yönteme (execCommand) düşülüyor:', err);
            fallbackCopy(text, finish);
          });
        } else {
          fallbackCopy(text, finish);
        }
      };

      // ÖNEMLİ: navigator.clipboard.write() tıklama anında, senkron olarak çağrılmalı;
      // aksi halde tarayıcı "kullanıcı etkileşimi" iznini kaybedip yazmayı reddediyor.
      // Bu yüzden resmi bekletmek yerine, Promise olarak doğrudan ClipboardItem'a veriyoruz.
      if (imageBlobPromise && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        try {
          const item = new ClipboardItem({
            'text/plain': Promise.resolve(new Blob([text], { type: 'text/plain' })),
            'image/png': imageBlobPromise.then(blob => {
              if (!blob) throw new Error('Resim oluşturulamadı');
              return blob;
            })
          });
          navigator.clipboard.write([item]).then(finish).catch((err) => {
            console.warn('Görsel panoya kopyalanamadı, metin olarak deneniyor:', err);
            textOnlyFallback();
          });
          return;
        } catch (err) {
          console.warn('ClipboardItem oluşturulamadı:', err);
        }
      }
      textOnlyFallback();
    }
    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      cb();
    }
  </script>
